<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes orbFloat1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-25px) scale(1.1)}}@keyframes orbFloat2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,30px) scale(.95)}}@keyframes pulseCard{0%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 12px rgba(99,102,241,.45))}}@keyframes waveMove{0%{transform:translateX(0)}}.bg{fill:url(#bgGrad)}.grid-line{stroke:#334155;stroke-opacity:.25;stroke-width:1}.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:url(#titleGrad);letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:19px;fill:#cbd5e1;letter-spacing:.2px}.pill-